[package]
name = "mythic-iced"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
const_format = "0.2.36"
dirs = "7.0.0"
env_logger = "0.11.11"
iced = "0.14.0"
iced_graphics = { version = "0.14.0", features = ["geometry", "image", "svg", "web-colors"], default-features = false }
isahc = { version = "2.0.1", features = ["json"] }
log = "0.4.34"
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_url_params = "0.2.1"
smart-default = "0.7.1"
toml = "1.1.6"
